name: Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run tests
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Run-Tests.ps1
